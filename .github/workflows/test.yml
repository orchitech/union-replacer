name: test-matrix
on: push
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        node: [ 22, 24 ]
    steps:
     - uses: actions/checkout@v5
     - uses: actions/setup-node@v5
       with:
         node-version: ${{ matrix.node }}
         cache: npm
     - run: npm ci
     - run: npm run build --if-present
     - run: npm test
       env:
         CI: true
